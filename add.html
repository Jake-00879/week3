<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 관리 서비스 - 상품 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="my.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">📦 Product Manager</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">상품 목록</a>
                <a class="nav-link active" href="add.html">상품 등록</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h3 class="fw-bold mb-0">신규 상품 등록</h3>
                    </div>
                    <div class="card-body p-4">
                        <form id="addForm" onsubmit="return validateAndSubmit(event)"
                            <div class="mb-3">
                                <label for="pname" class="form-label fw-bold">품명 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="pname" placeholder="2자 이상 입력하세요">
                            </div>

                            <div class="mb-3">
                                <label for="category" class="form-label fw-bold">품목 <span class="text-danger">*</span></label>
                                <select class="form-select" id="category">
                                    <option value="">품목을 선택하세요</option>
                                    <option value="전자기기">전자기기</option>
                                    <option value="의류">의류</option>
                                    <option value="식품">식품</option>
                                    <option value="잡화">잡화</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="price" class="form-label fw-bold">가격(원) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="price" placeholder="100원 이상 숫자로 입력하세요">
                            </div>

                            <div class="mb-3">
                                <label for="stock" class="form-label fw-bold">재고 수량 <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="stock" placeholder="1개 이상 입력하세요">
                            </div>

                            <div class="mb-3">
                                <label for="buyDate" class="form-label fw-bold">구매/입고일자 <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="buyDate">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">담당자 이메일 <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" placeholder="example@domain.com">
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a href="index.html" class="btn btn-secondary px-4">취소</a>
                                <button type="submit" class="btn btn-primary px-4">추가</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer bg-light text-center py-3 border-top mt-auto">
        <div class="container text-muted small">&copy; 2026 Product Management Service.</div>
    </footer>

    <script>
        function validateAndSubmit(event) {
            event.preventDefault();

            const pname = document.getElementById('pname').value.trim();
            const category = document.getElementById('category').value;
            const price = document.getElementById('price').value;
            const stock = document.getElementById('stock').value;
            const buyDate = document.getElementById('buyDate').value;
            const email = document.getElementById('email').value.trim();

            if (pname.length < 2) {
                alert("품명은 최소 2자 이상 입력해야 합니다.");
                document.getElementById('pname').focus();
                return false;
            }

            if (!category) {
                alert("품목(카테고리)을 선택해주세요.");
                document.getElementById('category').focus();
                return false;
            }

            if (!price || Number(price) < 100) {
                alert("가격은 100원 이상이어야 합니다.");
                document.getElementById('price').focus();
                return false;
            }

            if (!stock || Number(stock) < 1) {
                alert("재고 수량은 최소 1개 이상이어야 합니다.");
                document.getElementById('stock').focus();
                return false;
            }

            if (!buyDate) {
                alert("구매/입고일자를 선택해주세요.");
                document.getElementById('buyDate').focus();
                return false;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("올바른 이메일 형식이 아닙니다.");
                document.getElementById('email').focus();
                return false;
            }

            alert("게시물이 추가됩니다.");
            window.location.href = "index.html";
            return true;
        }
    </script>
</body>
</html>
